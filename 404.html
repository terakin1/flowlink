<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FLOWLINK — страница не найдена</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#08060f" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2308060f'/%3E%3Crect x='6' y='6' width='52' height='52' rx='11' fill='%238b5cf6'/%3E%3Cpath d='M22 18h22v8H30v7h12v8H30v11h-8z' fill='%2308060f'/%3E%3C/svg%3E" />
<style>
  :root{--bg:#08060f;--ink:#f5f6f8;--dim:#a49cc0;--acc:#8b5cf6;--line:rgba(255,255,255,.12)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:grid;place-items:center;padding:40px 20px;
    background:var(--bg);color:var(--ink);
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
  .box{width:min(620px,100%);text-align:center}
  .logo{font-weight:800;letter-spacing:.26em;font-size:14px}
  .logo b{color:var(--acc)}
  .code{margin-top:34px;font-family:ui-monospace,Consolas,monospace;font-size:13px;
    letter-spacing:.24em;color:var(--acc);text-transform:uppercase}
  h1{margin-top:16px;font-size:clamp(26px,6vw,40px);line-height:1.08;
    text-transform:uppercase;letter-spacing:-.02em}
  p{margin-top:16px;color:var(--dim);font-size:16px}
  a.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:30px;
    border-radius:999px;padding:14px 28px;font-weight:700;font-size:15px;
    background:var(--acc);color:#08060f;text-decoration:none;border:1px solid var(--acc)}
  a.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(200,255,61,.22)}
  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);
    font-size:13px;color:#6f7887}
</style>
</head>
<body>
<div class="box">
  <div class="logo">FLOW<b>LINK</b></div>
  <div class="code">Ошибка 404</div>
  <h1>Такой страницы нет</h1>
  <p>Ссылка устарела или в адресе опечатка. Всё, что нужно, собрано на главной:
  инструкция, 12 промптов и 10 приёмов.</p>
  <a class="btn" href="./">На главную</a>
  <footer>FLOWLINK 1.0.0</footer>
</div>
</body>
</html>
